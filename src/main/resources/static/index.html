<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Order Engine & GenAI Analytics</title>
    <!-- Tailwind CSS Engine for a polished UI -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-950 p-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-space-2">
                <span class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    OrderEngine AI
                </span>
                <span class="ml-3 px-2.5 py-0.5 text-xs font-semibold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    Live Dashboard
                </span>
            </div>
            <div class="text-sm text-slate-400 font-mono" id="api-status">Connecting to cluster...</div>
        </div>
    </header>

    <!-- Main Workspace Matrix -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Placement Transaction Console -->
        <section class="lg:col-span-4 bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-2xl h-fit">
            <h2 class="text-xl font-bold mb-4 text-slate-200">Execute Order Placement</h2>
            <form id="orderForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Product Designation</label>
                    <input type="text" id="productName" required placeholder="e.g., iPhone 15 Pro Max" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Unit Valuation ($)</label>
                        <input type="number" id="price" required step="0.01" placeholder="1200.00" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Quantity</label>
                        <input type="number" id="quantity" required min="1" value="1" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-1">Customer Verification Notes / Prompt Input</label>
                    <textarea id="customerNotes" rows="4" placeholder="Enter transaction delivery instructions or explicit statements here..." 
                              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-cyan-500 transition-colors"></textarea>
                </div>
                <button type="submit" id="submitBtn"
                        class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-lg hover:shadow-cyan-500/10 transition-all active:scale-[0.98]">
                    Dispatch to Core Engine
                </button>
            </form>
        </section>

        <!-- Right Column: Live Telemetry Ledger -->
        <section class="lg:col-span-8 flex flex-col space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-200">Persistent Cloud Audit Trail</h2>
                <button onclick="fetchLedgerData()" class="text-xs text-cyan-400 hover:text-cyan-300 font-mono tracking-wider uppercase">
                    Force Refresh Ledger ↻
                </button>
            </div>
            
            <!-- Real-time Order Cards Stream Container -->
            <div id="ledgerStream" class="space-y-4 max-h-[calc(100vh-180px)] overflow-y-auto pr-2 custom-scrollbar">
                <!-- Dynamic Content injected via JS execution context -->
                <div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                    No records found inside database registry.
                </div>
            </div>
        </section>
    </main>

    <!-- Execution Orchestration Script -->
    <script>
        const API_BASE = '/api/orders';

        // 1. Core Boot Loop Configuration
        document.addEventListener('DOMContentLoaded', () => {
            fetchLedgerData();
            document.getElementById('orderForm').addEventListener('submit', dispatchTransaction);
        });

        // 2. Fetch Active Database Telemetry Records
        async function fetchLedgerData() {
            const statusIndicator = document.getElementById('api-status');
            try {
                const res = await fetch(API_BASE);
                if (!res.ok) throw new Error('Database lookup failure status tracking runtime error');
                const data = await res.json();
                
                statusIndicator.innerText = "CLUSTER HEALTHY";
                statusIndicator.className = "text-sm text-emerald-400 font-mono";
                
                renderLedgerStream(data);
            } catch (err) {
                statusIndicator.innerText = "CLUSTER CONNECTIVITY DEGRADED";
                statusIndicator.className = "text-sm text-rose-500 font-mono";
                console.error(err);
            }
        }

        // 3. Render Incoming Records dynamically using semantic asset layouts
        function renderLedgerStream(orders) {
            const stream = document.getElementById('ledgerStream');
            if (!orders || orders.length === 0) {
                stream.innerHTML = `<div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-xl">No records found inside database registry.</div>`;
                return;
            }

            // Order chronologically by latest record first
            orders.sort((a, b) => b.id - a.id);

            stream.innerHTML = orders.map(order => {
                const isFraud = order.flaggedAsFraud;
                const statusBadgeColor = isFraud ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                const sentimentColor = order.aiSentimentAnalysis === 'POSITIVE' ? 'text-emerald-400' : order.aiSentimentAnalysis === 'NEGATIVE' ? 'text-rose-400' : 'text-amber-400';

                return `
                    <div class="bg-slate-950 border border-slate-800 hover:border-slate-700 transition-all rounded-xl p-5 shadow-xl flex flex-col space-y-4">
                        <div class="flex justify-between items-start border-b border-slate-800 pb-3">
                            <div>
                                <h3 class="text-lg font-bold text-slate-100">${order.productName}</h3>
                                <p class="text-xs text-slate-500 font-mono mt-0.5">DB_RECORD_ID: #${order.id} | Timestamp: ${new Date(order.createdAt).toLocaleTimeString()}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 text-xs font-mono rounded bg-slate-900 border border-slate-700 text-slate-400">${order.aiSuggestedCategory || 'GENERAL'}</span>
                                <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full border ${statusBadgeColor}">${order.status}</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-4 text-sm bg-slate-900/50 p-3 rounded-lg border border-slate-900">
                            <div>
                                <span class="block text-xxs font-semibold tracking-wider text-slate-500 uppercase">Financial Volume</span>
                                <span class="text-slate-200 font-medium font-mono">$${(order.price * order.quantity).toFixed(2)}</span>
                            </div>
                            <div>
                                <span class="block text-xxs font-semibold tracking-wider text-slate-500 uppercase">Claude Sentiment</span>
                                <span class="${sentimentColor} font-bold font-mono">${order.aiSentimentAnalysis || 'UNKNOWN'}</span>
                            </div>
                            <div>
                                <span class="block text-xxs font-semibold tracking-wider text-slate-500 uppercase">Fraud Metric</span>
                                <span class="${isFraud ? 'text-rose-400 font-bold' : 'text-slate-400'} font-mono">${isFraud ? '⚠️ CRITICAL RISK' : '✅ REJECTED'}</span>
                            </div>
                        </div>

                        ${order.customerNotes ? `
                            <div class="text-xs bg-slate-900/30 p-2.5 rounded border border-slate-900 text-slate-400 font-serif italic">
                                "${order.customerNotes}"
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        // 4. Dispatch a Transaction record to the core backend REST loopasync function dispatchTransaction(e) {e.preventDefault();const btn = document.getElementById('submitBtn');const originalText = btn.innerText;btn.innerText = "Claude API evaluating payload metrics...";btn.disabled = true;const payload = {productName: document.getElementById('productName').value,price: parseFloat(document.getElementById('price').value),quantity: parseInt(document.getElementById('quantity').value),customerNotes: document.getElementById('customerNotes').value};try {const res = await fetch(API_BASE, {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify(payload)});if (!res.ok) throw new Error('Transaction server execution runtime error');// Clear the form entry cells on network successdocument.getElementById('orderForm').reset();await fetchLedgerData();} catch (err) {alert('💥 Engine System Exception Alert Encountered during network dispatch');console.error(err);} finally {btn.innerText = originalText;btn.disabled = false;}}
